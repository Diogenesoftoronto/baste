server {
    listen 80;
    # Preserve HTTPS and local preview ports when normalizing directory routes.
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"baste-public","mode":"static"}'; }
    location ^~ /api/ { return 404; }
    location ~ ^/\. { return 404; }
    location / { try_files $uri $uri/ =404; }
    location /build/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
