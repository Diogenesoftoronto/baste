server {
    listen 80;
    # Preserve HTTPS and local preview ports when normalizing directory routes.
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { proxy_pass http://127.0.0.1:3456/health; proxy_set_header Host 127.0.0.1:3456; }
    location = /api/health { proxy_pass http://127.0.0.1:3456/health; proxy_set_header Host 127.0.0.1:3456; }
    location ^~ /api/notorganic/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Baste-CSRF $http_x_baste_csrf;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 30s;
    }
    location ^~ /api/ { return 404; }
    location ~ ^/\. { return 404; }
    location ~ \.vtt$ { types { text/vtt vtt; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location /build/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
