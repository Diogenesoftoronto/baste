<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="20%" r="80%">
      <stop offset="0%"  stop-color="#1F1830"/>
      <stop offset="55%" stop-color="#0A0A12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="slime" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#C6FF00"/>
      <stop offset="55%"  stop-color="#7BFF36"/>
      <stop offset="100%" stop-color="#8A00FF"/>
    </radialGradient>
    <linearGradient id="bgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#EA7800"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C6FF00"/>
      <stop offset="60%"  stop-color="#7BFF36"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="halftone" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#C6FF00" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Neon glow blobs -->
  <circle cx="180"  cy="120" r="180" fill="#8A00FF" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="200" fill="#FF00B8" opacity="0.16" filter="url(#glow)"/>
  <circle cx="600"  cy="315" r="220" fill="#C6FF00" opacity="0.05" filter="url(#glow)"/>

  <!-- Splatter streaks -->
  <g opacity="0.5">
    <ellipse cx="80"   cy="540" rx="46" ry="14" fill="#C6FF00" transform="rotate(-18 80 540)"/>
    <ellipse cx="1100" cy="100" rx="38" ry="11" fill="#FF00B8" transform="rotate(20 1100 100)"/>
    <circle cx="980"  cy="80"  r="6" fill="#00F0FF"/>
    <circle cx="120"  cy="500" r="9" fill="#FF00B8"/>
    <circle cx="200"  cy="80"  r="5" fill="#C6FF00"/>
    <circle cx="1080" cy="560" r="7" fill="#7BFF36"/>
  </g>

  <!-- Left: Wordmark + tagline -->
  <g transform="translate(80, 230)">
    <!-- "BASTE" with drip shadow -->
    <text x="0" y="0" font-family="'Bowlby One', 'Space Grotesk', sans-serif" font-size="160" font-weight="900" fill="#0A0A0A" opacity="0.5" transform="translate(6, 8)">BASTE</text>
    <text x="0" y="0" font-family="'Bowlby One', 'Space Grotesk', sans-serif" font-size="160" font-weight="900" fill="url(#wordmark)" stroke="#0A0A0A" stroke-width="6" style="paint-order:stroke fill">BASTE</text>

    <!-- Tagline -->
    <text x="6" y="58" font-family="'Bowlby One', 'Space Grotesk', sans-serif" font-size="28" fill="#FFFFFF" letter-spacing="6">PERSONA-DRIVEN ASSET GENERATION</text>

    <!-- Sub-tag with emoji-style chips replaced by spray icons -->
    <g transform="translate(0, 100)">
      <g transform="translate(0, 0)">
        <rect x="-4" y="-26" width="170" height="36" rx="18" fill="rgba(198,255,0,0.18)" stroke="#C6FF00" stroke-width="2"/>
        <circle cx="14" cy="-8" r="6" fill="#C6FF00"/>
        <text x="30" y="-2" font-family="'Bowlby One', sans-serif" font-size="18" fill="#C6FF00" letter-spacing="2">SVG · IMAGE · VIDEO</text>
      </g>
      <g transform="translate(195, 0)">
        <rect x="-4" y="-26" width="180" height="36" rx="18" fill="rgba(138,0,255,0.22)" stroke="#8A00FF" stroke-width="2"/>
        <circle cx="14" cy="-8" r="6" fill="#8A00FF"/>
        <text x="30" y="-2" font-family="'Bowlby One', sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="2">QD · MAP-ELITES</text>
      </g>
      <g transform="translate(395, 0)">
        <rect x="-4" y="-26" width="200" height="36" rx="18" fill="rgba(255,0,184,0.18)" stroke="#FF00B8" stroke-width="2"/>
        <circle cx="14" cy="-8" r="6" fill="#FF00B8"/>
        <text x="30" y="-2" font-family="'Bowlby One', sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="2">LLM JUDGE · TOKENS</text>
      </g>
    </g>

    <!-- URL stamp -->
    <text x="6" y="230" font-family="'JetBrains Mono', monospace" font-size="22" fill="#9A8FB5" letter-spacing="2">baste.dev</text>
  </g>

  <!-- Right: Mascot mark, oversized -->
  <g transform="translate(820, 130)">
    <!-- Outer aura -->
    <circle cx="160" cy="160" r="170" fill="url(#slime)" opacity="0.3" filter="url(#glow)"/>
    <!-- Outer ring -->
    <circle cx="160" cy="160" r="148" fill="#0A0A0A"/>
    <circle cx="160" cy="160" r="136" fill="url(#slime)"/>
    <!-- Drips -->
    <path d="M40 200 Q 46 252 62 264 Q 76 276 80 256 Q 84 234 76 218" fill="#7BFF36"/>
    <path d="M224 240 Q 234 282 252 286 Q 270 290 270 268 Q 270 246 256 240" fill="#C6FF00"/>
    <path d="M120 280 Q 126 308 142 308 Q 158 308 158 290" fill="#8A00FF"/>
    <!-- Bubbles -->
    <circle cx="68"  cy="118" r="10" fill="#00F0FF"/>
    <circle cx="248" cy="106" r="8"  fill="#FF00B8"/>
    <circle cx="262" cy="178" r="6"  fill="#C6FF00"/>
    <!-- Big B -->
    <text x="160" y="220" text-anchor="middle"
      font-family="'Bowlby One', 'Space Grotesk', sans-serif"
      font-size="190" font-weight="900" fill="url(#bgrad)"
      stroke="#0A0A0A" stroke-width="10" style="paint-order:stroke fill">B</text>
  </g>
</svg>
