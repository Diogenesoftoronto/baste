name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm --prefix site run build:production
      - run: npm --prefix site run build.types
      - run: npm --prefix site run lint
      - run: npm --prefix site test
      - run: npm --prefix site run i18n:check
      - run: npm --prefix site run test:i18n
      - uses: actions/upload-artifact@v4
        with:
          name: baste-public-site
          path: site/dist

  account-container:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/prepare/account-routing-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp Dockerfile deployment/Dockerfile.account
      - run: docker build -f deployment/Dockerfile.account -t baste-account-review .
      - run: docker run -d --name baste-account-review --network none baste-account-review
      - name: Verify container without provider network access
        run: |
          for attempt in $(seq 1 30); do
            if docker exec baste-account-review node -e "fetch('http://127.0.0.1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker cp deployment/check-account-container.mjs baste-account-review:/app/check-account-container.mjs
          docker exec baste-account-review node /app/check-account-container.mjs
      - if: always()
        run: docker rm -f baste-account-review
