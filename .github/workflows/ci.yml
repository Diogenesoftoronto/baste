name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm --prefix site run build:production
      - run: npm --prefix site run build.types
      - run: npm --prefix site run lint
      - run: npm --prefix site test
      - run: npm --prefix site run i18n:check
      - run: npm --prefix site run test:i18n
      - uses: actions/upload-artifact@v4
        with:
          name: baste-public-site
          path: site/dist
